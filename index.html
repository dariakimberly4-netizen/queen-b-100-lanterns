<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Queen B — 100 Lanterns</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 75%,#30144d,#100719 55%,#030106);color:#fff;font-family:Georgia,serif;overflow:hidden}.sky{height:100vh;position:relative}.title{position:absolute;top:8%;width:100%;text-align:center;z-index:5}.title h1{letter-spacing:.18em;font-size:clamp(26px,7vw,54px);margin:0;color:#f5d789}.title p{opacity:.8;font-style:italic}.counter{position:absolute;top:24px;right:24px;font:12px Arial;letter-spacing:.16em;opacity:.65}.lantern{position:absolute;left:50%;top:58%;transform:translate(-50%,-50%);width:min(72vw,330px);height:min(92vw,420px);border-radius:48% 48% 30% 30%;background:linear-gradient(90deg,#7c4314,#ffd878 45%,#fff0b0 50%,#ffd878 55%,#7c4314);box-shadow:0 0 40px #ffbd4a88,0 0 120px #ff9d3055;display:grid;place-items:center;padding:18px;cursor:pointer;transition:.7s}.lantern:before,.lantern:after{content:'';position:absolute;left:12%;right:12%;height:10px;background:#6d3a15;border-radius:8px}.lantern:before{top:-7px}.lantern:after{bottom:-7px}.photo{width:88%;height:72%;object-fit:contain;border-radius:16px;background:#2b1238;box-shadow:0 8px 30px #0008}.hint{position:absolute;bottom:5%;width:100%;text-align:center;font:14px Arial;opacity:.72}.float{animation:float 3.5s ease-in-out infinite}@keyframes float{50%{transform:translate(-50%,-55%) rotate(1deg)}}.spark{position:absolute;width:4px;height:4px;border-radius:50%;background:#ffd76d;box-shadow:0 0 12px #ffd76d;animation:rise 6s linear infinite}@keyframes rise{to{transform:translateY(-110vh);opacity:0}}button{background:none;border:1px solid #f3d88c;color:#f3d88c;border-radius:999px;padding:12px 20px;font-size:16px}.final{display:none;position:absolute;inset:0;background:#050208;place-items:center;text-align:center;padding:28px}.final h2{font-size:clamp(34px,10vw,72px);color:#f4d787;margin:0}.final p{line-height:1.8}.video{width:min(92vw,900px);max-height:70vh;background:#000;border-radius:20px;display:none}</style></head><body><main class='sky' id='sky'><div class='title'><h1>QUEEN B</h1><p>For every memory, a light.</p></div><div class='counter' id='counter'>MEMORY 001 / 100</div><div class='lantern float' id='lantern' role='button' tabindex='0' aria-label='Open next memory'><img id='photo' class='photo' alt='Queen B memory'></div><div class='hint'>Tap the lantern • Swipe up for the next light</div><section class='final' id='final'><div><h2>HAPPY BIRTHDAY, SIS.</h2><p>100 memories.<br>100 lights.<br>One beautiful life. 👑</p><video id='video' class='video' controls playsinline></video></div></section></main><script>
const DRIVE_IDS=['assets/memory-001.jpg','assets/memory-002.jpg','assets/memory-003.jpg']; // local GitHub images
const VIDEO_ID=''; // paste the single Google Drive video file ID here
let i=0; const photo=document.querySelector('#photo'), counter=document.querySelector('#counter'), lantern=document.querySelector('#lantern'), final=document.querySelector('#final'), video=document.querySelector('#video');
const src=id=>id;
function show(){ if(!DRIVE_IDS.length){photo.removeAttribute('src');photo.alt='Connect the 100 Queen B photos';return} photo.src=src(DRIVE_IDS[i]);counter.textContent=`MEMORY ${String(i+1).padStart(3,'0')} / 100`; }
function next(){if(i<DRIVE_IDS.length-1){i++;show()}else if(i>=99||DRIVE_IDS.length===0){document.querySelector('.title p').textContent='One last light, Sis.';setTimeout(()=>{lantern.style.display='none';document.querySelector('.title').style.display='none';counter.style.display='none';document.querySelector('.hint').style.display='none';final.style.display='grid';if(VIDEO_ID){video.src=`https://drive.google.com/uc?export=download&id=${VIDEO_ID}`;video.style.display='block';video.play().catch(()=>{})}},700)}}
lantern.onclick=next;lantern.onkeydown=e=>{if(e.key==='Enter'||e.key===' ')next()};let y=0;addEventListener('touchstart',e=>y=e.touches[0].clientY,{passive:true});addEventListener('touchend',e=>{if(y-e.changedTouches[0].clientY>50)next()},{passive:true});
for(let n=0;n<35;n++){let s=document.createElement('i');s.className='spark';s.style.left=Math.random()*100+'%';s.style.top=(70+Math.random()*30)+'%';s.style.animationDelay=Math.random()*6+'s';document.querySelector('#sky').appendChild(s)}show();
</script></body></html>
